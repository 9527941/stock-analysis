name: Update Intraday

on:
  schedule:
    # 北京时间 9:30-11:30, 13:00-15:00 每 5 分钟（UTC 1:30-3:30, 5:00-7:00）
    - cron: '*/5 1-3,5-7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch intraday
        run: node fetch-intraday.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/intraday/*.json
          git diff --cached --quiet || (git commit -m "update intraday $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
