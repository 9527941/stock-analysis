name: 更新日K静态数据

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 北京时间 9:35/10:35/11:35/13:35/14:35/15:35 触发，覆盖交易时段
    # 对应 UTC 1:35/2:35/3:35/5:35/6:35/7:35
    - cron: '35 1,2,3,5,6,7 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 拉取日K数据
        run: node fetch-daily.js
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily/*.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "auto: update daily klines $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
