name: Update Daily Data

on:
  schedule:
    # 北京时间 9:35, 10:35, 11:35, 13:35, 14:35, 15:35（UTC 1:35, 2:35, 3:35, 5:35, 6:35, 7:35）
    - cron: '35 1-3,5-7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch daily K-lines, index, sectors, fund flow
        run: node fetch-daily.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "update daily $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
