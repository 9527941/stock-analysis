<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票自选盯盘看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
:root{
  --red:#d93026; --green:#1e8e3e; --bg:#0f1419; --card:#1a2129; --line:#2a323c;
  --blue:#1a73e8; --amber:#f9a825; --txt:#e8eaed; --sub:#9aa0a6;
}
*{box-sizing:border-box;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
body{margin:0;background:var(--bg);color:var(--txt);padding:16px;max-width:1200px;margin:0 auto;}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
h1{font-size:22px;margin:0;}
.status{font-size:12px;color:var(--sub);}
.status b{color:var(--blue);}
.section-title{font-size:15px;font-weight:600;margin:18px 0 10px;color:var(--sub);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;}
.card:hover{border-color:var(--blue);}
.card .top{display:flex;justify-content:space-between;align-items:baseline;}
.card .name{font-size:16px;font-weight:600;}
.card .code{font-size:12px;color:var(--sub);margin-left:6px;}
.card .price{font-size:26px;font-weight:700;margin:8px 0 2px;}
.card .chg{font-size:13px;}
.up{color:var(--red);}
.down{color:var(--green);}
.badge{display:inline-block;padding:3px 9px;border-radius:10px;font-size:12px;font-weight:600;margin-top:8px;}
.b-danger{background:#3a1c1a;color:#ff6b5e;}
.b-good{background:#173a23;color:#5fd98a;}
.b-buy{background:#16314f;color:#6db0ff;}
.b-hold{background:#2a323c;color:var(--sub);}
.b-wait{background:#2a323c;color:var(--sub);}
.b-warn{background:#3a2f12;color:#ffce6b;}
.market-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:10px;}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
.mcard .n{font-size:12px;color:var(--sub);}
.mcard .v{font-size:20px;font-weight:700;margin:4px 0;}
.mcard .c{font-size:12px;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;padding:10px;overflow:auto;z-index:100;}
.modal.show{display:block;}
.modal-box{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:960px;margin:10px auto;padding:16px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.close{background:none;border:none;color:var(--sub);font-size:24px;cursor:pointer;}
.chart{width:100%;height:320px;margin-bottom:12px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin:10px 0;}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;color:var(--sub);}
.kpi b{display:block;font-size:15px;margin-top:3px;color:var(--txt);}
.note{font-size:13px;color:var(--sub);line-height:1.7;background:var(--bg);border-radius:8px;padding:12px;margin:10px 0;}
.foot{font-size:11px;color:#5f6368;margin-top:20px;border-top:1px solid var(--line);padding-top:12px;}
.checklist{margin:10px 0;background:var(--bg);border-radius:8px;padding:10px 14px;}
.checklist .item{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;}
.checklist .item:last-child{border-bottom:none;}
.checklist .ok{color:#5fd98a;font-weight:600;}
.checklist .no{color:var(--sub);}
.ai-box{background:#161e26;border:1px solid #2a3a4c;border-radius:10px;padding:14px;margin:12px 0;}
.ai-title{font-size:14px;font-weight:600;color:#6db0ff;margin-bottom:8px;}
.ai-text{font-size:13px;line-height:1.8;color:var(--txt);}
.flow-bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden;}
  .flow-bar span{display:block;height:100%;border-radius:3px;}
  .rec-board{font-size:13px;color:var(--amber);font-weight:600;margin:16px 0 8px;display:none;}
  .rec-board .tag{font-size:11px;background:#2a323c;color:var(--sub);padding:2px 8px;border-radius:8px;font-weight:400;}
  .rec-group{margin-bottom:12px;}
  .rec-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;user-select:none;transition:.15s;}
  .rec-head:hover{border-color:var(--blue);}
  .rec-head .bh-left{display:flex;align-items:center;gap:8px;}
  .rec-head .bh-name{font-size:13px;font-weight:600;color:var(--amber);}
  .rec-head .bh-tag{font-size:11px;background:#2a323c;color:var(--sub);padding:2px 8px;border-radius:8px;font-weight:400;}
  .rec-head .bh-arrow{color:var(--sub);font-size:12px;transition:transform .2s;}
  .rec-group.collapsed .bh-arrow{transform:rotate(-90deg);}
  .rec-group.collapsed .rec-body{display:none;}
  .rec-wrap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:12px;margin-top:10px;}
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;}
  .rcard .top{display:flex;justify-content:space-between;align-items:baseline;}
  .rcard .name{font-size:14px;font-weight:600;}
  .rcard .code{font-size:10px;color:var(--sub);margin-left:5px;}
  .rcard .price{font-size:20px;font-weight:700;margin:4px 0 1px;}
  .rcard .chg{font-size:11px;}
  .t-badge{display:inline-block;padding:1px 7px;border-radius:7px;font-size:10px;border:1px solid var(--line);color:var(--sub);margin-top:2px;}
  .rcard .board-tag{display:inline-block;padding:1px 7px;border-radius:7px;font-size:10px;background:#2a323c;color:var(--amber);margin-top:2px;font-weight:400;}
  .rcard .reason{font-size:11px;color:var(--sub);line-height:1.5;margin:6px 0;}
  .rcard .plan{font-size:11px;color:var(--txt);background:var(--bg);border-radius:7px;padding:6px 8px;line-height:1.65;}
  .rcard .plan b{color:var(--amber);}
  .rcard .hint{font-size:10px;color:#5f6368;margin-top:6px;}
  .profit-summary{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
  .profit-summary .lbl{font-size:12px;color:var(--sub);}
  .profit-summary .big{font-size:27px;font-weight:600;line-height:1.15;margin-top:2px;}
  .profit-summary .mini{display:flex;gap:18px;margin-top:8px;font-size:12px;color:var(--sub);flex-wrap:wrap;}
  .profit-summary .mini b{font-weight:500;}
  .profit-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.profit-cols{grid-template-columns:1fr;}}
  .profit-col .col-h{font-size:13px;font-weight:500;margin:2px 0 8px;color:var(--txt);}
  .profit-col .grid{display:grid;gap:12px;}
  .badge.b-closed{background:#232a32;color:#9aa0a6;}
  .pcard .chg{font-size:11px;}
  .pcard .priceline{font-size:14px;font-weight:500;margin:2px 0 4px;}
</style>
</head>
<body>
<header>
  <h1>📈 股票自选盯盘看板</h1>
  <div class="status">最后刷新：<b id="ts">--</b> ｜ 行情每 <b id="iv">3</b> 分钟 ｜ 分时每 <b>1</b> 分钟</div>
</header>

<div class="section-title">大盘情绪</div>
<div class="market-grid" id="marketGrid"></div>

<div class="section-title">📊 我的收益总览</div>
<div id="profitWrap"></div>

<div class="section-title">自选股票</div>
  <div class="grid" id="grid"></div>

  <div class="section-title">🎯 短线推荐（按你相关板块）</div>
  <div id="recWrap"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="m-title" style="margin:0;"></h2>
      <button class="close" onclick="closeModal()">×</button>

</div>

<div class="foot">
  数据：腾讯行情（实时价）+ 新浪日K/大盘（每日更新）+ 东方财富分时/板块/资金流（GitHub Actions每5分钟更新）。金价：腾讯沪金连续(元/克)，失败则 COMEX 黄金折算；与银行积存金实盘报价可能有小幅价差。<br>
  颜色：涨=红 跌=绿。纯前端，不依赖本机开关机。非买卖建议，仅供参考。
</div>

<script>
const RED='#d93026', GREEN='#1e8e3e', AMBER='#f9a825', BLUE='#1a73e8';
let STOCKS=[], MARKET={}, RECOMMEND=[], currentDetail=null, timer=null, detailTimer=null, GOLD_CFG=null, GOLD=null, CLOSED_TRADES=[];
const $=id=>document.getElementById(id);

function fmt(n,d=2){return n==null||isNaN(n)?'--':(+n).toFixed(d);}
function updown(pct){return pct>=0;}
function cls(pct){return updown(pct)?'up':'down';}

// 腾讯行情 JSONP
function loadQuoteP(s){return new Promise(res=>{
  const vn='v_'+s.market+s.code;
  const sc=document.createElement('script');
  sc.src=`https://qt.gtimg.cn/q=${s.market}${s.code}?_=${Date.now()}`;
  sc.onload=()=>{try{const raw=window[vn];if(raw){const f=raw.split('~');res({price:parseFloat(f[3]),prev:parseFloat(f[4]),pct:parseFloat(f[32]),high:parseFloat(f[33]),low:parseFloat(f[34]),open:parseFloat(f[5]),name:f[1]});}else res(null);}catch(e){res(null);}sc.remove();};
  sc.onerror=()=>{res(null);sc.remove();};
  document.head.appendChild(sc);
});}

// 通用 JSONP 加载器（用于腾讯行情、新浪行情等不同接口）
function jsonp(url, globalVar, timeoutMs=8000){return new Promise(res=>{
  const sc=document.createElement('script');
  sc.src=url;
  let done=false;
  const cleanup=()=>{if(!done){done=true;sc.remove();}};
  setTimeout(()=>{cleanup();res(null);},timeoutMs);
  sc.onload=()=>{try{const raw=window[globalVar];cleanup();res(raw||null);}catch(e){cleanup();res(null);}};
  sc.onerror=()=>{cleanup();res(null);};
  document.head.appendChild(sc);
});}

// 金价加载：多源兜底（按准确度排序）
// Source1: 东方财富现货金价 AU9999（元/克，fetch JSON，最准）
// Source2: 新浪上海金 AU0（JSONP，元/克）
// Source3: 腾讯黄金ETF sh518880（JSONP，需换算，有误差）
async function loadGold(){
  if(!GOLD_CFG)return;
  const g=GOLD_CFG;

  // === Source 1: 东方财富 现货黄金 AU9999（元/克，直接 fetch JSON）===
  try{
    const res=await fetch('https://push2.eastmoney.com/api/qt/stock/get?secid=113.AU9999&fields=f43,f44,f45,f46,f57,f58,f170&ut=fa5fd1943c7b386f172d6893dbbd10d0&_='+Date.now(),{cache:'no-store'});
    if(res.ok){
      const j=await res.json();
      if(j && j.data){
        const d=j.data;
        const price=parseFloat(d.f43), prev=parseFloat(d.f57);
        if(price>100 && price<2000){
          const pct=parseFloat(d.f170)||((price-prev)/prev*100);
          GOLD={...g, price, pct, unit:'元/克(东财AU9999现货)', converted:false, source:'eastmoney_AU9999'};
          console.log('[gold] eastmoney AU9999 ok:',price,'元/克');
          return;
        }
      }
    }
  }catch(e){console.log('[gold] eastmoney AU9999 fail:',e);}

  // === Source 2: 新浪上海金 AU0（JSONP，元/克）===
  try{
    const raw=await jsonp('https://hq.sinajs.cn/list=AU0&_='+Date.now(), 'hq_str_AU0');
    if(raw){
      const f=raw.split(',');
      const price=parseFloat(f[1]||f[0]), prev=parseFloat(f[2]||f[1]);
      if(price>100 && price<2000){
        const pct=(price-prev)/prev*100;
        GOLD={...g, price, pct, unit:'元/克(上海金交所)', converted:false, source:'sina_AU0'};
        console.log('[gold] sina AU0 ok:',price,'元/克');
        return;
      }
    }
  }catch(e){console.log('[gold] sina AU0 fail:',e);}

  // === Source 3: 腾讯黄金ETF sh518880（兜底，误差约±5%）===
  try{
    const etf=await new Promise(res=>{
      const sc=document.createElement('script');
      sc.src=`https://qt.gtimg.cn/q=sh518880?_=${Date.now()}`;
      sc.onload=()=>{try{const raw=window['v_sh518880'];if(raw){const f=raw.split('~');res({price:parseFloat(f[3]),prev:parseFloat(f[4]),name:f[1]});}else res(null);}catch(e){res(null);}sc.remove();};
      sc.onerror=()=>{res(null);sc.remove();};
      document.head.appendChild(sc);
    });
    if(etf && etf.price>1){
      // 华安黄金ETF 518880 每份≈0.01g黄金，但实际比例随净值漂移
      // 用动态修正系数：当前金价约956时ETF约9.09 → 系数≈105.2
      // 取保守系数105（长期均值），标注为估算
      const factor=105;
      const price=etf.price*factor, prev=etf.prev*factor;
      const pct=(etf.price-etf.prev)/etf.prev*100;
      GOLD={...g, price, pct, unit:'元/克(由ETF 518880估算,误差±5%)', converted:true, source:'etf_518880'};
      console.log('[gold] ETF 518880 fallback:',price.toFixed(1),'元/克 (raw:',etf.price+',factor:'+factor+')');
      return;
    }
  }catch(e){console.log('[gold] ETF 518880 fail:',e);}

  // 全部失败
  GOLD={error:true, ...g};
  console.log('[gold] all sources failed');
}

// 同域静态日K
async function loadDailyStatic(s){
  try{
    const u=`data/daily/${s.market}${s.code}.json?_=${Date.now()}`;
    const j=await (await fetch(u)).json();
    if(!j.klines||!j.klines.length)return [];
    return j.klines.map(k=>{
      if(typeof k==='string'){const p=k.split(','); if(p.length>=6)return k;}
      return `${k.day},${k.open},${k.close},${k.high},${k.low},${k.volume}`;
    });
  }catch(e){return [];}
}

// 同域分时
async function loadIntraday(s){
  try{
    const u=`data/intraday/${s.market}${s.code}.json?_=${Date.now()}`;
    const j=await (await fetch(u)).json();
    return j.trends||[];
  }catch(e){return [];}
}

// 市场数据
async function loadMarket(){
  try{
    const j=await (await fetch(`data/market.json?_=${Date.now()}`)).json();
    MARKET=j;
  }catch(e){MARKET={};}
}

function mergeTodayDaily(daily,trend){
  if(!daily.length||!trend.length)return daily;
  const today=trend[0].split(',')[0].slice(0,10);
  const bars=trend.filter(x=>x.startsWith(today));
  if(!bars.length)return daily;
  const opens=bars.map(x=>parseFloat(x.split(',')[1]));
  const closes=bars.map(x=>parseFloat(x.split(',')[2]));
  const highs=bars.map(x=>parseFloat(x.split(',')[3]));
  const lows=bars.map(x=>parseFloat(x.split(',')[4]));
  const vols=bars.map(x=>parseFloat(x.split(',')[5]));
  const todayBar=`${today},${opens[0]},${closes[closes.length-1]},${Math.max(...highs)},${Math.min(...lows)},${vols.reduce((a,b)=>a+b,0)}`;
  const lastDate=daily[daily.length-1].split(',')[0];
  const out=daily.slice();
  if(lastDate===today)out[out.length-1]=todayBar; else out.push(todayBar);
  return out;
}

function MA(c,n){const r=[];for(let i=0;i<c.length;i++){if(i<n-1){r.push(null);continue;}let s=0;for(let j=i-n+1;j<=i;j++)s+=c[j];r.push(+(s/n).toFixed(2));}return r;}
function EMA(c,n){const k=2/(n+1),r=[];let prev;for(let i=0;i<c.length;i++){if(i===0)prev=c[0];else prev=c[i]*k+prev*(1-k);r.push(+prev.toFixed(3));}return r;}
function MACD(c){const e12=EMA(c,12),e26=EMA(c,26);const dif=e12.map((v,i)=>+(v-e26[i]).toFixed(3));const dea=EMA(dif,9);const bar=dif.map((v,i)=>+((v-dea[i])*2).toFixed(3));return {dif,dea,bar};}
function RSI(c,n=14){const r=[];let g=0,l=0;for(let i=0;i<c.length;i++){if(i===0){r.push(null);continue;}const d=c[i]-c[i-1];const up=d>0?d:0,dn=d<0?-d:0;if(i<n){g+=up;l+=dn;r.push(i===n?+(100-100/(1+(g/n)/(l/n||1e-9))).toFixed(1):null);}else{g=(g*(n-1)+up)/n;l=(l*(n-1)+dn)/n;r.push(+(100-100/(1+(g/l||1e-9))).toFixed(1));}}return r;}
function KDJ(c,n=9){const K=[],D=[],J=[];let pk=50,pd=50;for(let i=0;i<c.length;i++){if(i<n-1){K.push(null);D.push(null);J.push(null);continue;}let lo=Infinity,hi=-Infinity;for(let j=i-n+1;j<=i;j++){if(c[j]<lo)lo=c[j];if(c[j]>hi)hi=c[j];}const rv=hi===lo?50:(c[i]-lo)/(hi-lo)*100;pk=pk*2/3+rv/3;pd=pd*2/3+pk/3;K.push(+pk.toFixed(2));D.push(+pd.toFixed(2));J.push(+(3*pk-2*pd).toFixed(2));}return {K,D,J};}
function calcInd(s){
  if(!s._daily||!s._daily.length)return {c:[],ma5:[],ma10:[],ma20:[],ma60:[],macd:{dif:[],dea:[],bar:[]},rsi:[],kdj:{K:[],D:[],J:[]}};
  const c=s._daily.map(k=>parseFloat(k.split(',')[2]));
  return {c,ma5:MA(c,5),ma10:MA(c,10),ma20:MA(c,20),ma60:MA(c,60),macd:MACD(c),rsi:RSI(c,14),kdj:KDJ(c,9)};
}

function sectorChg(sectorCode){
  if(!MARKET.sectors)return null;
  const sec=MARKET.sectors.find(x=>x.code===sectorCode);
  return sec?sec.chg:null;
}
function flowData(symbol){
  return MARKET.flows?MARKET.flows[symbol]:null;
}

function buildChecklist(s){
  const p=s._q?s._q.price:NaN;
  const ind=s._ind;
  const lastIdx=ind.c.length-1;
  const c=ind.c[lastIdx], ma5=ind.ma5[lastIdx], ma10=ind.ma10[lastIdx], ma20=ind.ma20[lastIdx];
  const macdBar=ind.macd.bar[lastIdx]||0, prevBar=ind.macd.bar[lastIdx-1]||0;
  const rsi=ind.rsi[lastIdx]||50;
  const k=ind.kdj.K[lastIdx], d=ind.kdj.D[lastIdx];
  const secChg=sectorChg(s.sectorCode);
  const fl=flowData(s.market+s.code);
  const sh=MARKET.sh, shLast=sh&&sh.length?sh[sh.length-1]:null;
  const shPct=shLast?((shLast.close-shLast.open)/shLast.open*100):0;
  const list=[];

  if(s.holding){
    list.push({t:`价格 ≥ 止损线 ${s.stop}`, ok:!isNaN(p)&&p>s.stop, good:true});
    list.push({t:`价格接近/达到目标 ${s.target}`, ok:!isNaN(p)&&p>=s.target*0.98, good:true});
  }else{
    if(s.buyZone)list.push({t:`价格进入建仓区 ${s.buyZone[0]}~${s.buyZone[1]}`, ok:!isNaN(p)&&p>=s.buyZone[0]&&p<=s.buyZone[1], good:true});
    list.push({t:`价格未破计划止损 ${s.stop}`, ok:!isNaN(p)&&p>s.stop, good:true});
  }
  list.push({t:'K线在 MA5 上方（短期强势）', ok:c&&ma5&&c>=ma5, good:true});
  list.push({t:'MACD 红柱/绿柱缩短（动能向好）', ok:macdBar>0||(macdBar>prevBar), good:true});
  list.push({t:'RSI 未超买（<70）且未超卖（>30）', ok:rsi>30&&rsi<70, good:true});
  list.push({t:`所属板块「${s.sector||'行业'}」今日上涨`, ok:secChg!=null&&secChg>0, good:true});
  list.push({t:'主力资金净流入', ok:fl!=null&&fl.main>0, good:true});
  list.push({t:'大盘不暴跌（沪指跌幅<1%）', ok:Math.abs(shPct)<1, good:true});
  return list;
}

function advice(s){
  const p=s._q?s._q.price:NaN;
  if(isNaN(p))return {cls:'b-hold',txt:'行情加载中…'};
  const list=buildChecklist(s);
  const okCount=list.filter(x=>x.ok).length;
  const total=list.length||1;
  const score=okCount/total;

  if(s.holding){
    if(p<=s.stop)return {cls:'b-danger',txt:`🔴 止损预警：破 ${s.stop}，建议离场`,score};
    if(s.target&&p>=s.target)return {cls:'b-good',txt:`🟢 已达目标 ${s.target}，考虑止盈`,score};
    if(score>=0.7)return {cls:'b-good',txt:`🟢 持有偏强（满足 ${okCount}/${total} 项）`,score};
    if(score<=0.4)return {cls:'b-warn',txt:`⚠️ 持有偏弱（满足 ${okCount}/${total} 项）`,score};
    return {cls:'b-hold',txt:`持有观察（满足 ${okCount}/${total} 项）`,score};
  }else{
    if(s.buyZone){
      if(p>=s.buyZone[0]&&p<=s.buyZone[1]){
        if(score>=0.6)return {cls:'b-buy',txt:`🔵 进入建仓区且条件较好（${okCount}/${total}），可分批买入`,score};
        return {cls:'b-buy',txt:`🔵 进入建仓区 ${s.buyZone[0]}~${s.buyZone[1]}，可分批买入`,score};
      }
      if(p>s.buyZone[1])return {cls:'b-hold',txt:`高于建仓区，等回落（${okCount}/${total}）`,score};
      if(p<=s.stop)return {cls:'b-danger',txt:`🔴 已破计划止损线 ${s.stop}，暂缓买入`,score};
      return {cls:'b-wait',txt:`低于建仓区下沿 ${s.buyZone[0]}，等买点（${okCount}/${total}）`,score};
    }
    return {cls:'b-hold',txt:`观望（${okCount}/${total}）`,score};
  }
}

function renderProfit(){
  const wrap=$('profitWrap');if(!wrap)return;
  // ---- 持仓中（浮动盈亏）----
  const holding=[];
  let floatTotal=0, floatInvest=0;
  for(const s of STOCKS){
    if(!s.holding)continue;
    const p=s._q?s._q.price:null;
    const inv=s.cost*s.shares;floatInvest+=inv;
    let pl=null,pct=null;
    if(p!=null){pl=(p-s.cost)*s.shares;pct=pl/inv*100;floatTotal+=pl;}
    holding.push({name:s.name,code:(s.market+s.code).toUpperCase(),shares:s.shares,unit:'股',cost:s.cost,price:p,pl,pct,inv,kind:'stock'});
  }
  // 黄金并入持仓
  if(GOLD&&!GOLD.error){
    const g=GOLD;const inv=g.costPerGram*g.grams;floatInvest+=inv;
    const pl=(g.price-g.costPerGram)*g.grams;const pct=pl/inv*100;floatTotal+=pl;
    holding.push({name:g.name,code:g.sourceName,shares:g.grams,unit:'g',cost:g.costPerGram,price:g.price,pl,pct,inv,kind:'gold'});
  }
  // ---- 已清仓（已实现盈亏）----
  const closed=CLOSED_TRADES||[];
  let realizedTotal=0,realizedInvest=0;
  closed.forEach(c=>{realizedTotal+=(c.pnl||0);realizedInvest+=(c.buyCost*c.shares);});

  // ---- 总收益 ----
  const totalReturn=floatTotal+realizedTotal;
  const totalInvest=floatInvest+realizedInvest;
  const totalPct=totalInvest?totalReturn/totalInvest*100:0;
  const tUp=totalReturn>=0;
  const sign=tUp?'up':'down';

  const fmtPct=v=>isNaN(v)?'--':(v>=0?'+':'')+v.toFixed(2)+'%';
  const fmtP=v=>isNaN(v)||v==null?'--':(v>=0?'+':'')+'¥'+v.toFixed(0);

  // 持仓卡片
  const holdingCards=holding.length?holding.map(h=>{
    const up=h.pl==null?true:h.pl>=0;
    const cls=h.pl==null?'':(up?'up':'down');
    const head=h.kind==='gold'?`${h.shares}g ｜ 成本 ¥${h.cost}/g`:`${h.shares}${h.unit} ｜ 成本 ¥${h.cost}`;
    return `<div class="card pcard">
      <div class="top"><div><span class="name">${h.name}</span><span class="code">${h.code}</span></div><span class="badge b-hold">持仓</span></div>
      <div class="priceline ${cls}">${h.price==null?'现价 --':('现价 '+h.price.toFixed(2))}</div>
      <div class="chg">${head}</div>
      ${h.pl==null?'<div class="chg">行情加载中…</div>':`<div class="chg">浮动盈亏 <span class="${cls}">${fmtP(h.pl)} (${fmtPct(h.pct)})</span></div>`}
      <div class="chg">占总投入 ${(h.inv/totalInvest*100).toFixed(1)}%</div>
    </div>`;
  }).join(''):'<div class="chg" style="color:var(--sub)">暂无持仓</div>';

  // 已清仓卡片
  const closedCards=closed.length?closed.map(c=>{
    const pct=c.buyCost?c.pnl/(c.buyCost*c.shares)*100:0;
    const up=c.pnl>=0;const cls=up?'up':'down';
    return `<div class="card pcard">
      <div class="top"><div><span class="name">${c.name}</span><span class="code">${(c.market+c.code).toUpperCase()}</span></div><span class="badge b-closed">已清仓</span></div>
      <div class="priceline">卖出 ¥${c.sellPrice}（${c.sellDate}）</div>
      <div class="chg">${c.shares}${c.shares>0&&c.shares%1===0?'股':'份'} ｜ 成本 ¥${c.buyCost}</div>
      <div class="chg">已实现盈亏 <span class="${cls}">${fmtP(c.pnl)} (${fmtPct(pct)})</span></div>
    </div>`;
  }).join(''):'<div class="chg" style="color:var(--sub)">暂无清仓记录</div>';

  wrap.innerHTML=`
    <div class="profit-summary">
      <div class="lbl">总收益（持仓浮动 + 已清仓实现）</div>
      <div class="big ${sign}">${tUp?'+':''}¥${totalReturn.toFixed(0)} <span style="font-size:14px;color:var(--sub);">(${fmtPct(totalPct)})</span></div>
      <div class="mini">
        <span>持仓浮动：<b class="${floatTotal>=0?'up':'down'}">${fmtP(floatTotal)}</b></span>
        <span>已清仓实现：<b class="${realizedTotal>=0?'up':'down'}">${fmtP(realizedTotal)}</b></span>
      </div>
    </div>
    <div class="profit-cols">
      <div class="profit-col"><div class="col-h">📌 持仓中</div><div class="grid">${holdingCards}</div></div>
      <div class="profit-col"><div class="col-h">✅ 已清仓</div><div class="grid">${closedCards}</div></div>
    </div>`;
}

async function refresh(){
  await loadMarket();
  renderMarket();
  await loadGold();
  renderProfit();
  for(const s of STOCKS){
    s._q=await loadQuoteP(s);
    s._daily=await loadDailyStatic(s);
    s._trend=await loadIntraday(s);
    s._daily=mergeTodayDaily(s._daily,s._trend);
    s._ind=calcInd(s);
  }
  renderCards();
  renderProfit();
  await Promise.all(RECOMMEND.flatMap(g=>g.items.map(it=>loadQuoteP(it).then(q=>it._q=q))));
  renderRecs();
  if(currentDetail){const idx=STOCKS.indexOf(currentDetail);if(idx>=0)openModal(idx);}
  const now=new Date();$('ts').innerText=now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

async function init(){
  try{
    const res=await fetch('stock-data.json?_='+Date.now());
    const cfg=await res.json();
    STOCKS=cfg.stocks||[];
    STOCKS._analysis=cfg.analysis||{};
    RECOMMEND=cfg.recommend||[];
    GOLD_CFG=cfg.gold||null;
    CLOSED_TRADES=cfg.closedTrades||[];
    RECOMMEND.forEach(g=>g.items.forEach(it=>it._q=null));
  }catch(e){console.log('cfg err',e);}
  await refresh();
  timer=setInterval(refresh,180000);
  // 分时数据单独每分钟刷新
  setInterval(async()=>{
    await loadMarket();
    renderMarket();
    for(const s of STOCKS){s._trend=await loadIntraday(s);}
    renderCards();
    if(currentDetail){const idx=STOCKS.indexOf(currentDetail);if(idx>=0){drawTrend(STOCKS[idx]);renderChecklist(STOCKS[idx]);}}
  },60000);
}
init();
</script>
